<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Personal Shopper</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .product-card {
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        
        .deal-badge {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .sustainable-badge {
            background: linear-gradient(135deg, #10b981, #059669);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = '';
        
        // API functions
        const api = {
            async search(query, maxPrice) {
                const res = await fetch(`${API_BASE}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, max_price: maxPrice }),
                });
                return res.json();
            },
            
            async shop(query, budget, sustainableOnly) {
                const res = await fetch(`${API_BASE}/api/shop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, budget, sustainable_only: sustainableOnly }),
                });
                return res.json();
            },
            
            async getShopStatus(jobId) {
                const res = await fetch(`${API_BASE}/api/shop/${jobId}`);
                return res.json();
            },
            
            async getProduct(productId) {
                const res = await fetch(`${API_BASE}/api/product/${productId}`);
                return res.json();
            },
            
            async getDeals() {
                const res = await fetch(`${API_BASE}/api/deals`);
                return res.json();
            },
        };
        
        // Components
        function Header() {
            return (
                <header className="py-6">
                    <div className="container mx-auto px-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="text-4xl">🛍️</div>
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800">Personal Shopper</h1>
                                    <p className="text-sm text-gray-600">AI-Powered Shopping Assistant</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <span className="px-3 py-1 bg-green-100 text-green-700 text-sm rounded-full">
                                    CrewAI Parallel
                                </span>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }
        
        function SearchBar({ onSearch, loading }) {
            const [query, setQuery] = useState('');
            const [budget, setBudget] = useState('');
            const [sustainable, setSustainable] = useState(false);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (query.trim()) {
                    onSearch(query, budget ? parseFloat(budget) : null, sustainable);
                }
            };
            
            const examples = [
                "winter jacket, sustainable",
                "running shoes under $150",
                "wireless headphones",
                "eco-friendly backpack",
            ];
            
            return (
                <div className="glass rounded-2xl p-6 shadow-xl">
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="flex gap-3">
                            <input
                                type="text"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="What are you looking for?"
                                className="flex-1 bg-white border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:border-amber-400 focus:outline-none"
                            />
                            <input
                                type="number"
                                value={budget}
                                onChange={(e) => setBudget(e.target.value)}
                                placeholder="Budget"
                                className="w-28 bg-white border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:border-amber-400 focus:outline-none"
                            />
                            <button
                                type="submit"
                                disabled={loading}
                                className="bg-amber-500 text-white px-8 py-3 rounded-xl font-semibold hover:bg-amber-600 disabled:opacity-50 transition-colors"
                            >
                                {loading ? '🔍' : '🛒 Shop'}
                            </button>
                        </div>
                        
                        <div className="flex items-center justify-between">
                            <label className="flex items-center space-x-2 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={sustainable}
                                    onChange={(e) => setSustainable(e.target.checked)}
                                    className="w-4 h-4 text-green-500 rounded"
                                />
                                <span className="text-gray-700">♻️ Sustainable products only</span>
                            </label>
                            
                            <div className="flex gap-2">
                                {examples.map((ex, i) => (
                                    <button
                                        key={i}
                                        type="button"
                                        onClick={() => setQuery(ex)}
                                        className="text-xs px-3 py-1 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200"
                                    >
                                        {ex}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </form>
                </div>
            );
        }
        
        function TeamVisualization() {
            const agents = [
                { emoji: '🎩', name: 'Concierge', desc: 'Main interface' },
                { emoji: '👔', name: 'Style Advisor', desc: 'Preferences' },
                { emoji: '🔍', name: 'Search Agent', desc: 'Multi-site' },
                { emoji: '💰', name: 'Deals Finder', desc: 'Coupons' },
                { emoji: '📊', name: 'Price Compare', desc: 'Best prices' },
                { emoji: '⭐', name: 'Review Analyzer', desc: 'Sentiment' },
                { emoji: '🎁', name: 'Recommender', desc: 'Final picks' },
            ];
            
            return (
                <div className="glass rounded-2xl p-4">
                    <h3 className="text-sm font-semibold text-gray-700 mb-3">Shopping Team</h3>
                    <div className="space-y-2">
                        {agents.map(agent => (
                            <div key={agent.name} className="flex items-center space-x-2 text-sm">
                                <span className="text-lg">{agent.emoji}</span>
                                <span className="font-medium text-gray-800">{agent.name}</span>
                                <span className="text-gray-500 text-xs">• {agent.desc}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function ProductCard({ recommendation }) {
            const { product, final_price, match_reasons, deals, rank } = recommendation;
            
            const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '📦';
            const hasDiscount = final_price < product.price;
            
            return (
                <div className="product-card glass rounded-2xl overflow-hidden">
                    <div className="p-6">
                        <div className="flex items-start justify-between mb-3">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl">{rankEmoji}</span>
                                <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">
                                    #{rank}
                                </span>
                            </div>
                            
                            {product.is_sustainable && (
                                <span className="sustainable-badge text-white text-xs px-2 py-1 rounded-full">
                                    ♻️ Sustainable
                                </span>
                            )}
                        </div>
                        
                        <h3 className="text-lg font-bold text-gray-800 mb-1">{product.name}</h3>
                        <p className="text-gray-600 text-sm mb-3">{product.brand}</p>
                        
                        <div className="flex items-baseline space-x-2 mb-3">
                            <span className="text-2xl font-bold text-amber-600">
                                ${final_price.toFixed(2)}
                            </span>
                            {hasDiscount && (
                                <span className="text-gray-400 line-through">
                                    ${product.price.toFixed(2)}
                                </span>
                            )}
                        </div>
                        
                        <div className="flex items-center space-x-2 mb-3">
                            <span className="text-amber-500">
                                {'⭐'.repeat(Math.round(product.rating))}
                            </span>
                            <span className="text-gray-500 text-sm">
                                {product.rating}/5 ({product.review_count.toLocaleString()} reviews)
                            </span>
                        </div>
                        
                        <div className="text-sm text-gray-600 mb-3">
                            <span className="font-medium">Why: </span>
                            {match_reasons.join(', ')}
                        </div>
                        
                        {deals && deals.length > 0 && (
                            <div className="space-y-1 mb-3">
                                {deals.map((deal, i) => (
                                    <div key={i} className="deal-badge bg-green-100 text-green-700 text-sm px-3 py-1 rounded-lg inline-block mr-2">
                                        🏷️ {deal.description}
                                        {deal.code && <span className="font-mono ml-1">({deal.code})</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        <div className="flex items-center justify-between text-sm text-gray-500 pt-3 border-t">
                            <span>🏪 {product.retailer.charAt(0).toUpperCase() + product.retailer.slice(1)}</span>
                            <span>{product.in_stock ? '✅ In Stock' : '❌ Out of Stock'}</span>
                        </div>
                    </div>
                </div>
            );
        }
        
        function DealsSection({ deals }) {
            if (!deals || deals.length === 0) return null;
            
            return (
                <div className="glass rounded-2xl p-6 mt-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4">🏷️ Available Deals</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {deals.map((deal, i) => (
                            <div key={i} className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                                <div className="font-semibold text-gray-800">{deal.description}</div>
                                {deal.code && (
                                    <div className="mt-2">
                                        <span className="bg-amber-200 text-amber-800 font-mono text-sm px-2 py-1 rounded">
                                            {deal.code}
                                        </span>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function LoadingState() {
            return (
                <div className="glass rounded-2xl p-12 text-center">
                    <div className="text-6xl mb-4 animate-bounce">🛒</div>
                    <div className="text-xl font-semibold text-gray-800 mb-2">
                        Shopping Assistants Working...
                    </div>
                    <div className="text-gray-600">
                        Searching retailers, finding deals, analyzing reviews...
                    </div>
                </div>
            );
        }
        
        function App() {
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            
            const handleSearch = async (query, budget, sustainable) => {
                setLoading(true);
                setResults(null);
                
                try {
                    const { job_id } = await api.shop(query, budget, sustainable);
                    
                    // Poll for results
                    const pollInterval = setInterval(async () => {
                        const status = await api.getShopStatus(job_id);
                        
                        if (status.status === 'complete') {
                            clearInterval(pollInterval);
                            setResults(status);
                            setLoading(false);
                        } else if (status.status === 'error') {
                            clearInterval(pollInterval);
                            setLoading(false);
                            alert('Error: ' + status.error);
                        }
                    }, 1000);
                } catch (err) {
                    setLoading(false);
                    console.error(err);
                }
            };
            
            return (
                <div className="min-h-screen pb-12">
                    <Header />
                    
                    <main className="container mx-auto px-4">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            {/* Sidebar */}
                            <div className="lg:col-span-1">
                                <TeamVisualization />
                            </div>
                            
                            {/* Main Content */}
                            <div className="lg:col-span-3 space-y-6">
                                <SearchBar onSearch={handleSearch} loading={loading} />
                                
                                {loading && <LoadingState />}
                                
                                {results && results.recommendations && (
                                    <>
                                        <div className="text-lg font-semibold text-gray-700">
                                            Found {results.recommendations.length} recommendations
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {results.recommendations.map((rec, i) => (
                                                <ProductCard key={i} recommendation={rec} />
                                            ))}
                                        </div>
                                        
                                        <DealsSection deals={results.deals} />
                                    </>
                                )}
                                
                                {!loading && !results && (
                                    <div className="glass rounded-2xl p-12 text-center">
                                        <div className="text-6xl mb-4">🛍️</div>
                                        <div className="text-xl font-semibold text-gray-800 mb-2">
                                            Your Personal Shopping Assistant
                                        </div>
                                        <div className="text-gray-600">
                                            Tell me what you're looking for and I'll find the best options!
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    
                    <footer className="mt-12 py-6 text-center text-gray-600">
                        🛍️ Personal Shopper • CrewAI Parallel Architecture • AI-Powered
                    </footer>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
