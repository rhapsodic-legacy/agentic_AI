<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Investment Research Firm</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-card {
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .recommendation-buy { background: linear-gradient(135deg, #10b981, #059669); }
        .recommendation-sell { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .recommendation-hold { background: linear-gradient(135deg, #eab308, #ca8a04); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const API_BASE = '';
        
        // API functions
        const api = {
            async getStock(symbol) {
                const res = await fetch(`${API_BASE}/api/stock/${symbol}`);
                return res.json();
            },
            
            async getPrices(symbol, period = '6mo') {
                const res = await fetch(`${API_BASE}/api/stock/${symbol}/prices?period=${period}`);
                return res.json();
            },
            
            async getTechnical(symbol) {
                const res = await fetch(`${API_BASE}/api/stock/${symbol}/technical`);
                return res.json();
            },
            
            async getFundamental(symbol) {
                const res = await fetch(`${API_BASE}/api/stock/${symbol}/fundamental`);
                return res.json();
            },
            
            async getValuation(symbol) {
                const res = await fetch(`${API_BASE}/api/stock/${symbol}/valuation`);
                return res.json();
            },
            
            async screenStocks(symbols) {
                const res = await fetch(`${API_BASE}/api/screen`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbols }),
                });
                return res.json();
            },
            
            async startResearch(symbol) {
                const res = await fetch(`${API_BASE}/api/research`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol }),
                });
                return res.json();
            },
            
            async getResearchStatus(symbol) {
                const res = await fetch(`${API_BASE}/api/research/${symbol}/status`);
                return res.json();
            },
        };
        
        // Components
        function Header() {
            return (
                <header className="border-b border-white/10 py-4">
                    <div className="container mx-auto px-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="text-3xl">💰</div>
                                <div>
                                    <h1 className="text-2xl font-bold text-white">Investment Research</h1>
                                    <p className="text-sm text-gray-400">AI-Powered Equity Analysis</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <span className="text-sm text-gray-400">Hub-and-Spoke Architecture</span>
                                <span className="px-2 py-1 bg-green-500/20 text-green-400 text-xs rounded">CrewAI</span>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }
        
        function SearchBar({ onSearch }) {
            const [symbol, setSymbol] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (symbol.trim()) {
                    onSearch(symbol.trim().toUpperCase());
                }
            };
            
            return (
                <form onSubmit={handleSubmit} className="flex space-x-3">
                    <input
                        type="text"
                        value={symbol}
                        onChange={(e) => setSymbol(e.target.value.toUpperCase())}
                        placeholder="Enter stock symbol (e.g., NVDA)"
                        className="flex-1 bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-500"
                    />
                    <button
                        type="submit"
                        className="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600"
                    >
                        Analyze
                    </button>
                </form>
            );
        }
        
        function QuickActions({ onAction }) {
            const popularStocks = ['NVDA', 'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'JPM', 'JNJ'];
            
            return (
                <div className="flex flex-wrap gap-2 mt-4">
                    {popularStocks.map(symbol => (
                        <button
                            key={symbol}
                            onClick={() => onAction(symbol)}
                            className="px-3 py-1.5 bg-white/10 text-gray-300 rounded-lg text-sm hover:bg-white/20"
                        >
                            {symbol}
                        </button>
                    ))}
                </div>
            );
        }
        
        function MetricCard({ title, value, subtitle, trend }) {
            const trendColor = trend === 'up' ? 'text-green-400' : trend === 'down' ? 'text-red-400' : 'text-gray-400';
            
            return (
                <div className="metric-card glass rounded-xl p-4">
                    <div className="text-sm text-gray-400">{title}</div>
                    <div className="text-2xl font-bold text-white mt-1">{value}</div>
                    {subtitle && <div className={`text-sm mt-1 ${trendColor}`}>{subtitle}</div>}
                </div>
            );
        }
        
        function StockOverview({ stock }) {
            if (!stock) return null;
            
            const formatNumber = (n) => {
                if (n >= 1e12) return `$${(n/1e12).toFixed(2)}T`;
                if (n >= 1e9) return `$${(n/1e9).toFixed(2)}B`;
                if (n >= 1e6) return `$${(n/1e6).toFixed(2)}M`;
                return `$${n?.toFixed(2) || 'N/A'}`;
            };
            
            return (
                <div className="glass rounded-xl p-6 mb-6">
                    <div className="flex items-start justify-between mb-6">
                        <div>
                            <h2 className="text-3xl font-bold text-white">{stock.symbol}</h2>
                            <p className="text-gray-400">{stock.name}</p>
                            <p className="text-sm text-gray-500 mt-1">{stock.sector} • {stock.industry}</p>
                        </div>
                        <div className="text-right">
                            <div className="text-3xl font-bold text-white">${stock.current_price?.toFixed(2)}</div>
                            {stock.analyst_target_price && (
                                <div className="text-sm text-gray-400">
                                    Target: ${stock.analyst_target_price?.toFixed(2)}
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <MetricCard 
                            title="Market Cap" 
                            value={formatNumber(stock.market_cap)}
                        />
                        <MetricCard 
                            title="P/E Ratio" 
                            value={stock.pe_ratio?.toFixed(1) || 'N/A'}
                        />
                        <MetricCard 
                            title="Revenue Growth" 
                            value={stock.revenue_growth ? `${(stock.revenue_growth*100).toFixed(0)}%` : 'N/A'}
                            trend={stock.revenue_growth > 0 ? 'up' : 'down'}
                        />
                        <MetricCard 
                            title="Gross Margin" 
                            value={stock.gross_margin ? `${(stock.gross_margin*100).toFixed(0)}%` : 'N/A'}
                        />
                    </div>
                </div>
            );
        }
        
        function PriceChart({ symbol, prices }) {
            const chartRef = useRef(null);
            
            useEffect(() => {
                if (!prices || !chartRef.current) return;
                
                const trace = {
                    x: prices.map(p => p.date),
                    y: prices.map(p => p.close),
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#3b82f6', width: 2 },
                    fill: 'tozeroy',
                    fillcolor: 'rgba(59, 130, 246, 0.1)',
                };
                
                const layout = {
                    title: '',
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    font: { color: '#9ca3af' },
                    xaxis: { 
                        gridcolor: 'rgba(255,255,255,0.1)',
                        showgrid: false,
                    },
                    yaxis: { 
                        gridcolor: 'rgba(255,255,255,0.1)',
                        tickprefix: '$',
                    },
                    margin: { t: 20, r: 20, b: 40, l: 60 },
                };
                
                Plotly.newPlot(chartRef.current, [trace], layout, { responsive: true });
            }, [prices]);
            
            return (
                <div className="glass rounded-xl p-4">
                    <h3 className="text-lg font-semibold text-white mb-4">Price Chart</h3>
                    <div ref={chartRef} style={{ height: '300px' }}></div>
                </div>
            );
        }
        
        function TechnicalAnalysis({ data }) {
            if (!data) return null;
            
            const getTrendColor = (trend) => {
                if (trend === 'bullish') return 'text-green-400';
                if (trend === 'bearish') return 'text-red-400';
                return 'text-yellow-400';
            };
            
            const getRsiColor = (rsi) => {
                if (rsi > 70) return 'text-red-400';
                if (rsi < 30) return 'text-green-400';
                return 'text-white';
            };
            
            return (
                <div className="glass rounded-xl p-6">
                    <h3 className="text-lg font-semibold text-white mb-4">Technical Analysis</h3>
                    
                    <div className="mb-4">
                        <span className="text-gray-400">Trend: </span>
                        <span className={`font-bold ${getTrendColor(data.trend)}`}>
                            {data.trend?.toUpperCase()}
                        </span>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <div className="text-sm text-gray-400">RSI (14)</div>
                            <div className={`text-xl font-bold ${getRsiColor(data.rsi_14)}`}>
                                {data.rsi_14?.toFixed(1) || 'N/A'}
                            </div>
                        </div>
                        <div>
                            <div className="text-sm text-gray-400">MACD</div>
                            <div className="text-xl font-bold text-white">
                                {data.macd?.toFixed(2) || 'N/A'}
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-2 mb-4">
                        <div className="text-center">
                            <div className="text-xs text-gray-500">SMA 20</div>
                            <div className="text-sm text-white">${data.sma_20?.toFixed(2) || 'N/A'}</div>
                        </div>
                        <div className="text-center">
                            <div className="text-xs text-gray-500">SMA 50</div>
                            <div className="text-sm text-white">${data.sma_50?.toFixed(2) || 'N/A'}</div>
                        </div>
                        <div className="text-center">
                            <div className="text-xs text-gray-500">SMA 200</div>
                            <div className="text-sm text-white">${data.sma_200?.toFixed(2) || 'N/A'}</div>
                        </div>
                    </div>
                    
                    {data.signals && data.signals.length > 0 && (
                        <div>
                            <div className="text-sm text-gray-400 mb-2">Signals</div>
                            <div className="space-y-1">
                                {data.signals.map((signal, i) => (
                                    <div key={i} className="text-sm text-gray-300 flex items-center">
                                        <span className="text-blue-400 mr-2">→</span>
                                        {signal}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        function Valuation({ data, currentPrice }) {
            if (!data) return null;
            
            const upside = data.upside_potential * 100;
            const upsideColor = upside > 10 ? 'text-green-400' : upside < -10 ? 'text-red-400' : 'text-yellow-400';
            
            return (
                <div className="glass rounded-xl p-6">
                    <h3 className="text-lg font-semibold text-white mb-4">DCF Valuation</h3>
                    
                    <div className="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <div className="text-sm text-gray-400">Fair Value</div>
                            <div className="text-2xl font-bold text-white">
                                ${data.fair_value?.toFixed(2)}
                            </div>
                        </div>
                        <div>
                            <div className="text-sm text-gray-400">Upside</div>
                            <div className={`text-2xl font-bold ${upsideColor}`}>
                                {upside > 0 ? '+' : ''}{upside.toFixed(1)}%
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-2">
                        <div className="bg-green-500/20 rounded-lg p-3 text-center">
                            <div className="text-xs text-green-400">Bull</div>
                            <div className="text-lg font-bold text-green-400">
                                ${data.bull_case?.toFixed(0)}
                            </div>
                        </div>
                        <div className="bg-blue-500/20 rounded-lg p-3 text-center">
                            <div className="text-xs text-blue-400">Base</div>
                            <div className="text-lg font-bold text-blue-400">
                                ${data.base_case?.toFixed(0)}
                            </div>
                        </div>
                        <div className="bg-red-500/20 rounded-lg p-3 text-center">
                            <div className="text-xs text-red-400">Bear</div>
                            <div className="text-lg font-bold text-red-400">
                                ${data.bear_case?.toFixed(0)}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        function ResearchTeam() {
            const team = [
                { emoji: '📊', name: 'Research Director', role: 'Coordinates & Reviews' },
                { emoji: '🌍', name: 'Macro Analyst', role: 'Economic Context' },
                { emoji: '📈', name: 'Equity Analyst', role: 'Fundamentals' },
                { emoji: '💻', name: 'Tech Analyst', role: 'Tech Sector' },
                { emoji: '🏦', name: 'Finance Analyst', role: 'Finance Sector' },
                { emoji: '🏥', name: 'Healthcare Analyst', role: 'Healthcare' },
                { emoji: '🔢', name: 'Quant Researcher', role: 'Quantitative' },
                { emoji: '💼', name: 'Portfolio Manager', role: 'Final Decisions' },
            ];
            
            return (
                <div className="glass rounded-xl p-4">
                    <h3 className="text-sm font-medium text-gray-400 mb-3">Research Team</h3>
                    <div className="space-y-2">
                        {team.map(member => (
                            <div key={member.name} className="flex items-center space-x-2 text-sm">
                                <span>{member.emoji}</span>
                                <span className="text-white">{member.name.split(' ')[0]}</span>
                                <span className="text-gray-500 text-xs">• {member.role}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function App() {
            const [symbol, setSymbol] = useState(null);
            const [stock, setStock] = useState(null);
            const [prices, setPrices] = useState(null);
            const [technical, setTechnical] = useState(null);
            const [valuation, setValuation] = useState(null);
            const [loading, setLoading] = useState(false);
            
            const handleSearch = async (sym) => {
                setLoading(true);
                setSymbol(sym);
                
                try {
                    const [stockData, priceData, techData, valData] = await Promise.all([
                        api.getStock(sym),
                        api.getPrices(sym),
                        api.getTechnical(sym),
                        api.getValuation(sym),
                    ]);
                    
                    setStock(stockData);
                    setPrices(priceData.prices);
                    setTechnical(techData);
                    setValuation(valData);
                } catch (err) {
                    console.error(err);
                }
                
                setLoading(false);
            };
            
            return (
                <div className="min-h-screen">
                    <Header />
                    
                    <main className="container mx-auto px-4 py-6">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            {/* Sidebar */}
                            <div className="space-y-4">
                                <ResearchTeam />
                            </div>
                            
                            {/* Main Content */}
                            <div className="lg:col-span-3 space-y-6">
                                <div className="glass rounded-xl p-6">
                                    <SearchBar onSearch={handleSearch} />
                                    <QuickActions onAction={handleSearch} />
                                </div>
                                
                                {loading && (
                                    <div className="text-center py-12">
                                        <div className="text-4xl mb-4">🔍</div>
                                        <div className="text-white">Analyzing...</div>
                                    </div>
                                )}
                                
                                {!loading && stock && (
                                    <>
                                        <StockOverview stock={stock} />
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <PriceChart symbol={symbol} prices={prices} />
                                            <TechnicalAnalysis data={technical} />
                                        </div>
                                        
                                        <Valuation data={valuation} currentPrice={stock.current_price} />
                                    </>
                                )}
                                
                                {!loading && !stock && (
                                    <div className="text-center py-12">
                                        <div className="text-6xl mb-4">📈</div>
                                        <div className="text-xl text-white mb-2">Investment Research Platform</div>
                                        <div className="text-gray-400">Enter a stock symbol to begin analysis</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    
                    <footer className="border-t border-white/10 py-4 mt-8">
                        <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                            💰 Investment Research Firm • CrewAI Hub-and-Spoke • AI-Powered Analysis
                        </div>
                    </footer>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
