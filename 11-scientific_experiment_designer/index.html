<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔬 Scientific Experiment Designer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace; }
        
        body {
            background: linear-gradient(135deg, #0c4a6e 0%, #0f172a 50%, #581c87 100%);
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .team-card {
            transition: all 0.3s ease;
        }
        
        .team-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .step-indicator {
            transition: all 0.3s ease;
        }
        
        .step-indicator.active {
            background: #06b6d4;
            color: white;
        }
        
        .step-indicator.complete {
            background: #22c55e;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = '';
        
        // API functions
        const api = {
            async getFields() {
                const res = await fetch(`${API_BASE}/api/fields`);
                return res.json();
            },
            
            async getExperimentTypes() {
                const res = await fetch(`${API_BASE}/api/experiment-types`);
                return res.json();
            },
            
            async getExamples() {
                const res = await fetch(`${API_BASE}/api/examples`);
                return res.json();
            },
            
            async design(data) {
                const res = await fetch(`${API_BASE}/api/design`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                return res.json();
            },
            
            async getDesignStatus(jobId) {
                const res = await fetch(`${API_BASE}/api/design/${jobId}`);
                return res.json();
            },
        };
        
        // Components
        function Header() {
            return (
                <header className="py-6 border-b border-white/10">
                    <div className="container mx-auto px-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="text-4xl">🔬</div>
                                <div>
                                    <h1 className="text-3xl font-bold text-white">Experiment Designer</h1>
                                    <p className="text-sm text-gray-400">AI-Powered Scientific Protocol Generation</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <span className="px-3 py-1 bg-purple-500/20 text-purple-300 text-sm rounded-full">
                                    AutoGen Nested Teams
                                </span>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }
        
        function NestedTeamVisualization({ activeTeam }) {
            const teams = [
                { id: 'hypothesis', name: 'Hypothesis Team', emoji: '📚', agents: ['Literature Reviewer', 'Gap Identifier', 'Hypothesis Generator'] },
                { id: 'design', name: 'Experiment Design', emoji: '🧪', agents: ['Protocol Designer', 'Controls Specialist', 'Safety Reviewer'] },
                { id: 'analysis', name: 'Analysis Team', emoji: '📊', agents: ['Statistics Expert', 'Data Visualizer', 'Interpreter'] },
            ];
            
            return (
                <div className="glass rounded-xl p-4 mb-6">
                    <div className="text-center mb-4">
                        <div className="inline-block px-4 py-2 bg-cyan-500/20 rounded-lg">
                            <div className="text-lg font-semibold text-cyan-300">👨‍🔬 Principal Investigator</div>
                            <div className="text-xs text-gray-400">Oversees Research Project</div>
                        </div>
                    </div>
                    
                    <div className="flex items-center justify-center mb-2">
                        <div className="w-px h-6 bg-white/20"></div>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-4">
                        {teams.map(team => (
                            <div 
                                key={team.id}
                                className={`team-card p-4 rounded-lg ${
                                    activeTeam === team.id 
                                        ? 'bg-cyan-500/20 ring-2 ring-cyan-500' 
                                        : 'bg-black/30'
                                }`}
                            >
                                <div className="text-center mb-3">
                                    <div className="text-2xl mb-1">{team.emoji}</div>
                                    <div className="text-sm font-semibold text-white">{team.name}</div>
                                </div>
                                <div className="space-y-1">
                                    {team.agents.map(agent => (
                                        <div key={agent} className="text-xs text-gray-400 bg-black/30 rounded px-2 py-1">
                                            {agent}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function DesignForm({ onDesign, loading, fields, experimentTypes }) {
            const [question, setQuestion] = useState('');
            const [field, setField] = useState('Biology');
            const [expType, setExpType] = useState('Randomized Controlled Trial');
            const [effectSize, setEffectSize] = useState(0.5);
            const [duration, setDuration] = useState(56);
            
            const exampleQuestions = [
                "Does cognitive training improve working memory in older adults?",
                "What is the effect of compound X on tumor growth in mice?",
                "Does mindfulness meditation reduce anxiety symptoms?",
            ];
            
            return (
                <div className="glass rounded-xl p-6">
                    <h3 className="text-lg font-semibold text-white mb-4">🔬 Design Your Experiment</h3>
                    
                    <div className="space-y-4">
                        <div>
                            <label className="text-sm text-gray-400 block mb-1">Research Question</label>
                            <textarea
                                value={question}
                                onChange={(e) => setQuestion(e.target.value)}
                                placeholder="Does intervention X affect outcome Y in population Z?"
                                className="w-full h-24 bg-black/30 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-gray-500 text-sm"
                            />
                            <div className="flex gap-2 mt-2">
                                {exampleQuestions.slice(0, 2).map((q, i) => (
                                    <button
                                        key={i}
                                        onClick={() => setQuestion(q)}
                                        className="text-xs px-2 py-1 bg-cyan-500/20 text-cyan-300 rounded hover:bg-cyan-500/30"
                                    >
                                        Example {i + 1}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-sm text-gray-400 block mb-1">Research Field</label>
                                <select
                                    value={field}
                                    onChange={(e) => setField(e.target.value)}
                                    className="w-full bg-black/30 border border-white/20 rounded-lg px-4 py-2 text-white"
                                >
                                    {fields.map(f => (
                                        <option key={f} value={f}>{f}</option>
                                    ))}
                                </select>
                            </div>
                            
                            <div>
                                <label className="text-sm text-gray-400 block mb-1">Experiment Type</label>
                                <select
                                    value={expType}
                                    onChange={(e) => setExpType(e.target.value)}
                                    className="w-full bg-black/30 border border-white/20 rounded-lg px-4 py-2 text-white"
                                >
                                    {experimentTypes.slice(0, 8).map(t => (
                                        <option key={t} value={t}>{t}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-sm text-gray-400 block mb-1">
                                    Effect Size (Cohen's d): {effectSize}
                                </label>
                                <input
                                    type="range"
                                    min="0.2"
                                    max="1.0"
                                    step="0.1"
                                    value={effectSize}
                                    onChange={(e) => setEffectSize(parseFloat(e.target.value))}
                                    className="w-full"
                                />
                            </div>
                            
                            <div>
                                <label className="text-sm text-gray-400 block mb-1">
                                    Duration: {duration} days
                                </label>
                                <input
                                    type="range"
                                    min="14"
                                    max="180"
                                    step="7"
                                    value={duration}
                                    onChange={(e) => setDuration(parseInt(e.target.value))}
                                    className="w-full"
                                />
                            </div>
                        </div>
                        
                        <button
                            onClick={() => onDesign({ 
                                research_question: question, 
                                field, 
                                experiment_type: expType,
                                effect_size: effectSize,
                                duration_days: duration,
                            })}
                            disabled={loading || !question.trim()}
                            className="w-full bg-cyan-500 text-white py-3 rounded-lg font-semibold hover:bg-cyan-600 disabled:opacity-50 transition-colors"
                        >
                            {loading ? '🔬 Designing Experiment...' : '🧪 Design Experiment'}
                        </button>
                    </div>
                </div>
            );
        }
        
        function DesignResult({ result }) {
            if (!result) return null;
            
            return (
                <div className="space-y-6">
                    {/* Overview */}
                    <div className="glass rounded-xl p-6">
                        <h3 className="text-lg font-semibold text-white mb-4">📋 Design Overview</h3>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">Field</div>
                                <div className="text-white font-semibold">{result.field}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">Type</div>
                                <div className="text-white font-semibold text-sm">{result.experiment_type}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">Sample Size</div>
                                <div className="text-cyan-400 font-bold text-xl">n = {result.sample_size}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">Duration</div>
                                <div className="text-white font-semibold">{result.duration_days} days</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Hypotheses */}
                    <div className="glass rounded-xl p-6">
                        <h3 className="text-lg font-semibold text-white mb-4">📐 Hypotheses</h3>
                        
                        <div className="space-y-3">
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm mb-1">H₀ (Null Hypothesis)</div>
                                <div className="text-white">{result.hypotheses?.null}</div>
                            </div>
                            <div className="bg-cyan-500/10 border border-cyan-500/30 rounded-lg p-4">
                                <div className="text-cyan-400 text-sm mb-1">H₁ (Alternative Hypothesis)</div>
                                <div className="text-white">{result.hypotheses?.alternative}</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Variables */}
                    <div className="glass rounded-xl p-6">
                        <h3 className="text-lg font-semibold text-white mb-4">📊 Variables</h3>
                        
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className="text-gray-400 border-b border-white/10">
                                        <th className="text-left py-2">Type</th>
                                        <th className="text-left py-2">Name</th>
                                        <th className="text-left py-2">Measurement</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {result.variables?.slice(0, 8).map((v, i) => (
                                        <tr key={i} className="border-b border-white/5">
                                            <td className="py-2">
                                                <span className={`px-2 py-1 rounded text-xs ${
                                                    v.type === 'Independent' ? 'bg-purple-500/20 text-purple-300' :
                                                    v.type === 'Dependent' ? 'bg-cyan-500/20 text-cyan-300' :
                                                    v.type === 'Confounding' ? 'bg-red-500/20 text-red-300' :
                                                    'bg-gray-500/20 text-gray-300'
                                                }`}>
                                                    {v.type}
                                                </span>
                                            </td>
                                            <td className="py-2 text-white">{v.name}</td>
                                            <td className="py-2 text-gray-400">{v.measurement}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    {/* Power Analysis */}
                    {result.power_analysis && (
                        <div className="glass rounded-xl p-6">
                            <h3 className="text-lg font-semibold text-white mb-4">⚡ Power Analysis</h3>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="bg-black/30 rounded-lg p-4 text-center">
                                    <div className="text-gray-400 text-sm">Test</div>
                                    <div className="text-white font-semibold text-sm">{result.power_analysis.test}</div>
                                </div>
                                <div className="bg-black/30 rounded-lg p-4 text-center">
                                    <div className="text-gray-400 text-sm">Effect Size</div>
                                    <div className="text-cyan-400 font-bold">{result.power_analysis.effect_size}</div>
                                </div>
                                <div className="bg-black/30 rounded-lg p-4 text-center">
                                    <div className="text-gray-400 text-sm">Power</div>
                                    <div className="text-green-400 font-bold">{(result.power_analysis.power * 100).toFixed(0)}%</div>
                                </div>
                                <div className="bg-black/30 rounded-lg p-4 text-center">
                                    <div className="text-gray-400 text-sm">N per Group</div>
                                    <div className="text-white font-bold text-xl">{result.power_analysis.n_per_group}</div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Protocol Steps */}
                    <div className="glass rounded-xl p-6">
                        <h3 className="text-lg font-semibold text-white mb-4">📝 Protocol Steps</h3>
                        
                        <div className="space-y-3">
                            {result.protocol_steps?.map((step, i) => (
                                <div key={i} className="flex items-start space-x-3">
                                    <div className="w-8 h-8 rounded-full bg-cyan-500/20 text-cyan-300 flex items-center justify-center text-sm font-bold flex-shrink-0">
                                        {step.step}
                                    </div>
                                    <div>
                                        <div className="text-white font-semibold">{step.title}</div>
                                        <div className="text-gray-400 text-sm">{step.description}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* Safety */}
                    <div className="glass rounded-xl p-6">
                        <h3 className="text-lg font-semibold text-white mb-4">🛡️ Safety & Ethics</h3>
                        
                        <div className="flex items-center space-x-4">
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">Risk Level</div>
                                <div className={`font-semibold ${
                                    result.safety?.risk_level === 'Minimal' || result.safety?.risk_level === 'Low' 
                                        ? 'text-green-400' 
                                        : 'text-yellow-400'
                                }`}>
                                    {result.safety?.risk_level}
                                </div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-4">
                                <div className="text-gray-400 text-sm">IRB Required</div>
                                <div className="text-white font-semibold">
                                    {result.safety?.irb_required ? 'Yes' : 'No'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        function App() {
            const [fields, setFields] = useState(['Biology', 'Psychology', 'Medicine', 'Pharmacology']);
            const [experimentTypes, setExperimentTypes] = useState(['Randomized Controlled Trial']);
            const [loading, setLoading] = useState(false);
            const [activeTeam, setActiveTeam] = useState(null);
            const [result, setResult] = useState(null);
            
            useEffect(() => {
                loadOptions();
            }, []);
            
            const loadOptions = async () => {
                try {
                    const [fieldsData, typesData] = await Promise.all([
                        api.getFields(),
                        api.getExperimentTypes(),
                    ]);
                    setFields(fieldsData.fields || []);
                    setExperimentTypes(typesData.types || []);
                } catch (err) {
                    console.error(err);
                }
            };
            
            const handleDesign = async (data) => {
                setLoading(true);
                setResult(null);
                
                // Simulate team progression
                const teams = ['hypothesis', 'design', 'analysis'];
                let teamIndex = 0;
                
                const teamInterval = setInterval(() => {
                    if (teamIndex < teams.length) {
                        setActiveTeam(teams[teamIndex]);
                        teamIndex++;
                    }
                }, 1500);
                
                try {
                    const { job_id } = await api.design(data);
                    
                    // Poll for completion
                    const pollInterval = setInterval(async () => {
                        const status = await api.getDesignStatus(job_id);
                        
                        if (status.status === 'complete') {
                            clearInterval(pollInterval);
                            clearInterval(teamInterval);
                            setActiveTeam(null);
                            setResult(status.result);
                            setLoading(false);
                        } else if (status.status === 'error') {
                            clearInterval(pollInterval);
                            clearInterval(teamInterval);
                            setActiveTeam(null);
                            setLoading(false);
                            alert('Error: ' + status.error);
                        }
                    }, 1000);
                } catch (err) {
                    clearInterval(teamInterval);
                    setLoading(false);
                    console.error(err);
                }
            };
            
            return (
                <div className="min-h-screen text-white">
                    <Header />
                    
                    <main className="container mx-auto px-4 py-6">
                        <NestedTeamVisualization activeTeam={activeTeam} />
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div>
                                <DesignForm 
                                    onDesign={handleDesign}
                                    loading={loading}
                                    fields={fields}
                                    experimentTypes={experimentTypes}
                                />
                            </div>
                            
                            <div>
                                {loading && (
                                    <div className="glass rounded-xl p-12 text-center">
                                        <div className="text-6xl mb-4">🔬</div>
                                        <div className="text-xl font-semibold mb-2">Designing Experiment...</div>
                                        <div className="text-gray-400">
                                            Our research teams are working on your protocol
                                        </div>
                                    </div>
                                )}
                                
                                {!loading && !result && (
                                    <div className="glass rounded-xl p-12 text-center">
                                        <div className="text-6xl mb-4">🧪</div>
                                        <div className="text-xl font-semibold mb-2">Ready to Design</div>
                                        <div className="text-gray-400">
                                            Enter your research question to generate a complete experimental protocol
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        {result && (
                            <div className="mt-6">
                                <DesignResult result={result} />
                            </div>
                        )}
                    </main>
                    
                    <footer className="border-t border-white/10 py-4 mt-8">
                        <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                            🔬 Scientific Experiment Designer • AutoGen Nested Teams • AI-Powered
                        </div>
                    </footer>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
