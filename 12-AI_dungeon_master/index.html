<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 AI Dungeon Master</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --parchment: #f4e4bc;
            --ink: #2c1810;
            --gold: #c9a227;
            --blood: #8b0000;
            --shadow: rgba(0,0,0,0.5);
        }
        
        * { font-family: 'Crimson Text', serif; }
        h1, h2, h3, .title { font-family: 'Cinzel', serif; }
        .medieval { font-family: 'MedievalSharp', cursive; }
        
        body {
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1f1f 50%, #1a0a0a 100%);
            min-height: 100vh;
        }
        
        /* Parchment effect */
        .parchment {
            background: linear-gradient(135deg, #f4e4bc 0%, #e8d5a3 50%, #f4e4bc 100%);
            box-shadow: 
                inset 0 0 50px rgba(0,0,0,0.1),
                0 0 20px rgba(0,0,0,0.3);
            border: 2px solid #8b7355;
        }
        
        /* Leather panel effect */
        .leather {
            background: linear-gradient(180deg, #3d2914 0%, #2a1d0f 100%);
            border: 3px solid #5c4033;
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.1),
                inset 0 -2px 4px rgba(0,0,0,0.3),
                0 4px 8px rgba(0,0,0,0.5);
        }
        
        /* Stone effect */
        .stone {
            background: linear-gradient(180deg, #4a4a4a 0%, #333 50%, #2a2a2a 100%);
            border: 2px solid #555;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        /* Glowing text */
        .glow-gold {
            text-shadow: 0 0 10px #c9a227, 0 0 20px #c9a227, 0 0 30px #c9a227;
        }
        
        .glow-red {
            text-shadow: 0 0 10px #ff4444, 0 0 20px #ff4444;
        }
        
        .glow-blue {
            text-shadow: 0 0 10px #4488ff, 0 0 20px #4488ff;
        }
        
        /* Dice animation */
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .dice-rolling {
            animation: roll 0.5s ease-in-out;
        }
        
        /* Health bar */
        .health-bar {
            background: linear-gradient(90deg, #2d0a0a 0%, #1a0505 100%);
            border: 2px solid #5c1010;
        }
        
        .health-fill {
            background: linear-gradient(90deg, #8b0000 0%, #cc0000 50%, #8b0000 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
            transition: width 0.5s ease;
        }
        
        /* Chat messages */
        .dm-message {
            border-left: 4px solid #c9a227;
            background: rgba(201, 162, 39, 0.1);
        }
        
        .player-message {
            border-left: 4px solid #4488ff;
            background: rgba(68, 136, 255, 0.1);
        }
        
        .combat-message {
            border-left: 4px solid #8b0000;
            background: rgba(139, 0, 0, 0.1);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #1a0a0a; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #5c4033 0%, #3d2914 100%);
            border-radius: 6px;
        }
        
        /* Input styling */
        .command-input {
            background: rgba(0,0,0,0.3);
            border: 2px solid #5c4033;
            caret-color: #c9a227;
        }
        
        .command-input:focus {
            border-color: #c9a227;
            box-shadow: 0 0 10px rgba(201, 162, 39, 0.3);
            outline: none;
        }
        
        /* Combat highlight */
        .combat-active {
            animation: pulse-red 2s infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 5px #8b0000; }
            50% { box-shadow: 0 0 20px #8b0000, 0 0 30px #ff0000; }
        }
        
        /* Torch flicker effect */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            75% { opacity: 0.9; }
        }
        
        .torch-light {
            animation: flicker 3s infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const API_BASE = '';
        
        // =================================================================
        // API Functions
        // =================================================================
        const api = {
            async newGame(playerName, characterClass, race) {
                const res = await fetch(`${API_BASE}/api/game/new`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        player_name: playerName,
                        character_class: characterClass,
                        race: race,
                    }),
                });
                return res.json();
            },
            
            async sendAction(gameId, action) {
                const res = await fetch(`${API_BASE}/api/game/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game_id: gameId, action }),
                });
                return res.json();
            },
            
            async rollDice(dice) {
                const res = await fetch(`${API_BASE}/api/dice/roll`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dice }),
                });
                return res.json();
            },
            
            async getClasses() {
                const res = await fetch(`${API_BASE}/api/classes`);
                return res.json();
            },
            
            async getRaces() {
                const res = await fetch(`${API_BASE}/api/races`);
                return res.json();
            },
        };
        
        // =================================================================
        // Components
        // =================================================================
        
        function DiceRoller({ onRoll }) {
            const [rolling, setRolling] = useState(false);
            const [lastRoll, setLastRoll] = useState(null);
            
            const roll = async (dice) => {
                setRolling(true);
                try {
                    const result = await api.rollDice(dice);
                    setLastRoll(result);
                    if (onRoll) onRoll(result);
                } catch (e) {
                    console.error(e);
                }
                setTimeout(() => setRolling(false), 500);
            };
            
            return (
                <div className="leather rounded-lg p-4">
                    <h3 className="title text-gold-400 text-lg mb-3 text-center" style={{color: '#c9a227'}}>
                        🎲 Dice Roller
                    </h3>
                    <div className="grid grid-cols-4 gap-2 mb-3">
                        {['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd100', '2d6'].map(die => (
                            <button
                                key={die}
                                onClick={() => roll(`1${die}`)}
                                className={`px-3 py-2 rounded bg-amber-900/50 hover:bg-amber-800/50 text-amber-200 text-sm transition-all ${rolling ? 'dice-rolling' : ''}`}
                            >
                                {die}
                            </button>
                        ))}
                    </div>
                    {lastRoll && (
                        <div className={`text-center p-3 rounded ${lastRoll.critical ? 'bg-green-900/50 glow-gold' : lastRoll.fumble ? 'bg-red-900/50 glow-red' : 'bg-black/30'}`}>
                            <div className="text-3xl font-bold" style={{color: lastRoll.critical ? '#ffd700' : lastRoll.fumble ? '#ff4444' : '#f4e4bc'}}>
                                {lastRoll.total}
                            </div>
                            <div className="text-sm text-gray-400">
                                {lastRoll.dice}: [{lastRoll.rolls.join(', ')}]
                                {lastRoll.critical && ' ⭐ CRITICAL!'}
                                {lastRoll.fumble && ' 💀 FUMBLE!'}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        function CharacterSheet({ character }) {
            if (!character) return null;
            
            const hpPercent = (character.current_hp / character.max_hp) * 100;
            
            return (
                <div className="parchment rounded-lg p-4" style={{color: '#2c1810'}}>
                    <h3 className="title text-2xl font-bold text-center mb-2">{character.name}</h3>
                    <div className="text-center text-sm mb-3">
                        {character.race} {character.class} (Level {character.level})
                    </div>
                    
                    {/* Health Bar */}
                    <div className="mb-4">
                        <div className="flex justify-between text-sm mb-1">
                            <span>❤️ Hit Points</span>
                            <span>{character.current_hp}/{character.max_hp}</span>
                        </div>
                        <div className="health-bar h-4 rounded-full overflow-hidden">
                            <div 
                                className="health-fill h-full rounded-full"
                                style={{width: `${hpPercent}%`}}
                            ></div>
                        </div>
                    </div>
                    
                    {/* AC */}
                    <div className="flex justify-center mb-4">
                        <div className="w-16 h-16 rounded-full border-4 border-amber-800 flex items-center justify-center bg-amber-100">
                            <div className="text-center">
                                <div className="text-2xl font-bold">{character.ac}</div>
                                <div className="text-xs">AC</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Ability Scores */}
                    {character.abilities && (
                        <div className="grid grid-cols-3 gap-2 text-center text-sm">
                            {Object.entries(character.abilities).map(([ability, score]) => (
                                <div key={ability} className="bg-amber-100 rounded p-2">
                                    <div className="font-bold">{ability}</div>
                                    <div className="text-xl">{score}</div>
                                    <div className="text-xs text-gray-600">
                                        ({Math.floor((score - 10) / 2) >= 0 ? '+' : ''}{Math.floor((score - 10) / 2)})
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }
        
        function GameMessage({ message, type }) {
            const typeClasses = {
                dm: 'dm-message',
                player: 'player-message',
                combat: 'combat-message',
                system: 'border-l-4 border-gray-500 bg-gray-900/50',
            };
            
            return (
                <div className={`p-4 rounded-r-lg mb-3 ${typeClasses[type] || typeClasses.dm}`}>
                    <div className="text-sm text-gray-400 mb-1">
                        {type === 'dm' && '🐉 Dungeon Master'}
                        {type === 'player' && '⚔️ You'}
                        {type === 'combat' && '⚔️ Combat'}
                        {type === 'system' && '⚙️ System'}
                    </div>
                    <div className="text-gray-100 whitespace-pre-wrap" 
                         dangerouslySetInnerHTML={{__html: formatMessage(message)}} />
                </div>
            );
        }
        
        function formatMessage(text) {
            // Convert **bold** to <strong>
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong class="text-amber-300">$1</strong>');
            // Convert *italic* to <em>
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            // Convert [Quest Updated] to styled
            text = text.replace(/\[Quest[^\]]+\]/g, '<span class="text-green-400">$&</span>');
            // Convert dice rolls
            text = text.replace(/\[Rolls?[^\]]+\]/g, '<span class="text-blue-400">$&</span>');
            // Convert 🎲 emoji sections
            text = text.replace(/(🎲[^🎲\n]+)/g, '<span class="text-purple-400">$1</span>');
            return text;
        }
        
        function CombatStatus({ combat }) {
            if (!combat || !combat.active) return null;
            
            return (
                <div className="stone rounded-lg p-4 combat-active">
                    <h3 className="title text-red-500 text-lg mb-3 text-center glow-red">
                        ⚔️ COMBAT ⚔️
                    </h3>
                    <div className="text-gray-300 text-sm">
                        <div className="mb-2">Round: {combat.round || 1}</div>
                        <div className="mb-2">Current Turn: {combat.current_turn || 'Unknown'}</div>
                    </div>
                </div>
            );
        }
        
        function LocationPanel({ location }) {
            return (
                <div className="leather rounded-lg p-4">
                    <h3 className="title text-lg mb-2" style={{color: '#c9a227'}}>
                        📍 Location
                    </h3>
                    <div className="text-amber-100 font-bold">{location || 'Unknown'}</div>
                </div>
            );
        }
        
        function QuestLog({ quests }) {
            return (
                <div className="leather rounded-lg p-4">
                    <h3 className="title text-lg mb-3" style={{color: '#c9a227'}}>
                        📜 Quest Log
                    </h3>
                    {quests && quests.length > 0 ? (
                        <ul className="space-y-2">
                            {quests.map((quest, i) => (
                                <li key={i} className="text-amber-100 text-sm flex items-start">
                                    <span className="mr-2">•</span>
                                    <span>{quest}</span>
                                </li>
                            ))}
                        </ul>
                    ) : (
                        <div className="text-gray-500 text-sm italic">No active quests</div>
                    )}
                </div>
            );
        }
        
        function QuickActions({ onAction, inCombat }) {
            const actions = inCombat ? [
                { label: '⚔️ Attack', action: 'attack' },
                { label: '🛡️ Dodge', action: 'dodge' },
                { label: '🏃 Disengage', action: 'disengage' },
                { label: '🧪 Use Potion', action: 'use healing potion' },
            ] : [
                { label: '👀 Look Around', action: 'look around' },
                { label: '🔍 Search', action: 'search the area' },
                { label: '🎒 Inventory', action: 'inventory' },
                { label: '📊 Status', action: 'status' },
            ];
            
            return (
                <div className="flex flex-wrap gap-2">
                    {actions.map(({ label, action }) => (
                        <button
                            key={action}
                            onClick={() => onAction(action)}
                            className="px-3 py-1 rounded bg-amber-900/50 hover:bg-amber-800/50 text-amber-200 text-sm transition-all"
                        >
                            {label}
                        </button>
                    ))}
                </div>
            );
        }
        
        function CharacterCreation({ onStart }) {
            const [name, setName] = useState('');
            const [selectedClass, setSelectedClass] = useState('Fighter');
            const [selectedRace, setSelectedRace] = useState('Human');
            
            const classes = [
                { name: 'Fighter', emoji: '⚔️', desc: 'Master of martial combat' },
                { name: 'Rogue', emoji: '🗡️', desc: 'Stealthy and cunning' },
                { name: 'Wizard', emoji: '🔮', desc: 'Wielder of arcane magic' },
                { name: 'Cleric', emoji: '✨', desc: 'Divine healer and protector' },
                { name: 'Ranger', emoji: '🏹', desc: 'Hunter of the wilds' },
                { name: 'Barbarian', emoji: '💪', desc: 'Fierce primal warrior' },
            ];
            
            const races = [
                { name: 'Human', emoji: '👤' },
                { name: 'Elf', emoji: '🧝' },
                { name: 'Dwarf', emoji: '⛏️' },
                { name: 'Halfling', emoji: '🦶' },
                { name: 'Half-Orc', emoji: '👹' },
                { name: 'Tiefling', emoji: '😈' },
            ];
            
            return (
                <div className="min-h-screen flex items-center justify-center p-8">
                    <div className="parchment rounded-xl p-8 max-w-2xl w-full" style={{color: '#2c1810'}}>
                        <h1 className="title text-4xl font-bold text-center mb-2">
                            Create Your Hero
                        </h1>
                        <p className="text-center mb-8 italic">
                            Your legend begins here...
                        </p>
                        
                        {/* Name Input */}
                        <div className="mb-6">
                            <label className="block text-lg font-bold mb-2">Name</label>
                            <input
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="Enter your character's name"
                                className="w-full px-4 py-3 rounded border-2 border-amber-800 bg-amber-50 text-lg"
                            />
                        </div>
                        
                        {/* Class Selection */}
                        <div className="mb-6">
                            <label className="block text-lg font-bold mb-2">Class</label>
                            <div className="grid grid-cols-3 gap-3">
                                {classes.map(c => (
                                    <button
                                        key={c.name}
                                        onClick={() => setSelectedClass(c.name)}
                                        className={`p-4 rounded border-2 transition-all ${
                                            selectedClass === c.name 
                                                ? 'border-amber-600 bg-amber-200' 
                                                : 'border-amber-300 bg-amber-50 hover:bg-amber-100'
                                        }`}
                                    >
                                        <div className="text-2xl mb-1">{c.emoji}</div>
                                        <div className="font-bold">{c.name}</div>
                                        <div className="text-xs text-gray-600">{c.desc}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Race Selection */}
                        <div className="mb-8">
                            <label className="block text-lg font-bold mb-2">Race</label>
                            <div className="grid grid-cols-6 gap-2">
                                {races.map(r => (
                                    <button
                                        key={r.name}
                                        onClick={() => setSelectedRace(r.name)}
                                        className={`p-3 rounded border-2 transition-all ${
                                            selectedRace === r.name 
                                                ? 'border-amber-600 bg-amber-200' 
                                                : 'border-amber-300 bg-amber-50 hover:bg-amber-100'
                                        }`}
                                    >
                                        <div className="text-xl">{r.emoji}</div>
                                        <div className="text-xs font-bold">{r.name}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Start Button */}
                        <button
                            onClick={() => onStart(name || 'Adventurer', selectedClass, selectedRace)}
                            className="w-full py-4 rounded-lg bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-white text-xl font-bold transition-all transform hover:scale-105"
                        >
                            🎲 Begin Your Adventure 🐉
                        </button>
                    </div>
                </div>
            );
        }
        
        function GameInterface({ gameId, character, initialMessage }) {
            const [messages, setMessages] = useState([
                { type: 'dm', content: initialMessage }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [gameState, setGameState] = useState({});
            const messagesEndRef = useRef(null);
            
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);
            
            const sendAction = async (action) => {
                if (!action.trim() || loading) return;
                
                // Add player message
                setMessages(prev => [...prev, { type: 'player', content: action }]);
                setInput('');
                setLoading(true);
                
                try {
                    const result = await api.sendAction(gameId, action);
                    
                    // Add DM response
                    const msgType = result.state?.in_combat ? 'combat' : 'dm';
                    setMessages(prev => [...prev, { type: msgType, content: result.response }]);
                    setGameState(result.state || {});
                    
                    if (!result.continue_game) {
                        setMessages(prev => [...prev, { 
                            type: 'system', 
                            content: 'Game ended. Thanks for playing!' 
                        }]);
                    }
                } catch (e) {
                    setMessages(prev => [...prev, { 
                        type: 'system', 
                        content: 'Error processing action. Please try again.' 
                    }]);
                }
                
                setLoading(false);
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                sendAction(input);
            };
            
            return (
                <div className="min-h-screen flex">
                    {/* Left Sidebar */}
                    <div className="w-80 p-4 space-y-4 overflow-y-auto" style={{maxHeight: '100vh'}}>
                        <CharacterSheet character={{
                            name: character.name,
                            race: character.race,
                            class: character.class,
                            level: 1,
                            current_hp: parseInt(gameState.player_hp?.split('/')[0]) || 12,
                            max_hp: parseInt(gameState.player_hp?.split('/')[1]) || 12,
                            ac: 16,
                            abilities: { STR: 16, DEX: 14, CON: 14, INT: 10, WIS: 12, CHA: 8 },
                        }} />
                        
                        <LocationPanel location={gameState.location || 'Willowmere Village'} />
                        
                        <QuestLog quests={gameState.quests || ['Find the Whispering Caverns']} />
                        
                        {gameState.in_combat && <CombatStatus combat={{ active: true, round: 1 }} />}
                        
                        <DiceRoller />
                    </div>
                    
                    {/* Main Game Area */}
                    <div className="flex-1 flex flex-col p-4">
                        {/* Header */}
                        <div className="leather rounded-lg p-4 mb-4">
                            <h1 className="title text-2xl text-center" style={{color: '#c9a227'}}>
                                🐉 The Whispering Caverns 🐉
                            </h1>
                        </div>
                        
                        {/* Messages */}
                        <div className="flex-1 overflow-y-auto mb-4 p-4 rounded-lg" style={{background: 'rgba(0,0,0,0.3)', maxHeight: 'calc(100vh - 300px)'}}>
                            {messages.map((msg, i) => (
                                <GameMessage key={i} message={msg.content} type={msg.type} />
                            ))}
                            {loading && (
                                <div className="text-center text-gray-400 py-4">
                                    <span className="animate-pulse">The Dungeon Master is thinking...</span>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                        
                        {/* Quick Actions */}
                        <div className="mb-3">
                            <QuickActions onAction={sendAction} inCombat={gameState.in_combat} />
                        </div>
                        
                        {/* Input */}
                        <form onSubmit={handleSubmit} className="flex gap-2">
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="What do you do? (e.g., 'examine the runes', 'attack the goblin')"
                                className="command-input flex-1 px-4 py-3 rounded-lg text-amber-100 placeholder-gray-500"
                                disabled={loading}
                            />
                            <button
                                type="submit"
                                disabled={loading || !input.trim()}
                                className="px-6 py-3 rounded-lg bg-amber-700 hover:bg-amber-600 disabled:opacity-50 text-white font-bold transition-all"
                            >
                                ⚔️ Act
                            </button>
                        </form>
                    </div>
                </div>
            );
        }
        
        function App() {
            const [gameStarted, setGameStarted] = useState(false);
            const [gameId, setGameId] = useState(null);
            const [character, setCharacter] = useState(null);
            const [openingMessage, setOpeningMessage] = useState('');
            const [loading, setLoading] = useState(false);
            
            const startGame = async (name, characterClass, race) => {
                setLoading(true);
                try {
                    const result = await api.newGame(name, characterClass, race);
                    setGameId(result.game_id);
                    setCharacter(result.character);
                    setOpeningMessage(result.opening);
                    setGameStarted(true);
                } catch (e) {
                    console.error('Failed to start game:', e);
                    // Start with demo mode
                    setGameId('demo');
                    setCharacter({ name, class: characterClass, race });
                    setOpeningMessage(`Welcome, ${name} the ${race} ${characterClass}!\n\nYou stand in the village square of Willowmere as the sun sets. The locals bustle about, finishing their daily tasks. A weathered notice board catches your eye, and the warm glow of a tavern beckons from the north.\n\nWhat do you do?`);
                    setGameStarted(true);
                }
                setLoading(false);
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4 animate-pulse">🎲</div>
                            <div className="text-2xl text-amber-500 title">Rolling for adventure...</div>
                        </div>
                    </div>
                );
            }
            
            if (!gameStarted) {
                return <CharacterCreation onStart={startGame} />;
            }
            
            return (
                <GameInterface 
                    gameId={gameId} 
                    character={character} 
                    initialMessage={openingMessage}
                />
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
