<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Incident Response System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        code, .mono { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: #0f0f0f;
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sev1 { border-left: 4px solid #ef4444; }
        .sev2 { border-left: 4px solid #f97316; }
        .sev3 { border-left: 4px solid #eab308; }
        .sev4 { border-left: 4px solid #3b82f6; }
        
        .status-healthy { color: #10b981; }
        .status-warning { color: #eab308; }
        .status-critical { color: #ef4444; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        .terminal {
            background: #1a1a1a;
            border: 1px solid #333;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = '';
        
        // API functions
        const api = {
            async getStatus() {
                const res = await fetch(`${API_BASE}/api/status`);
                return res.json();
            },
            
            async getServices() {
                const res = await fetch(`${API_BASE}/api/services`);
                return res.json();
            },
            
            async getHealth(service) {
                const res = await fetch(`${API_BASE}/api/health/${service}`);
                return res.json();
            },
            
            async simulate(service, incidentType) {
                const res = await fetch(`${API_BASE}/api/simulate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service, incident_type: incidentType }),
                });
                return res.json();
            },
            
            async getIncidentStatus(jobId) {
                const res = await fetch(`${API_BASE}/api/incident/${jobId}`);
                return res.json();
            },
            
            async getIncidents() {
                const res = await fetch(`${API_BASE}/api/incidents`);
                return res.json();
            },
            
            async executeAction(service, action, parameters = {}) {
                const res = await fetch(`${API_BASE}/api/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service, action, parameters }),
                });
                return res.json();
            },
        };
        
        // Components
        function Header({ activeIncidents }) {
            return (
                <header className="border-b border-white/10 py-4">
                    <div className="container mx-auto px-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className={`text-3xl ${activeIncidents > 0 ? 'pulse' : ''}`}>🚨</div>
                                <div>
                                    <h1 className="text-2xl font-bold text-white">Incident Response</h1>
                                    <p className="text-sm text-gray-400">Autonomous DevOps Management</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                {activeIncidents > 0 ? (
                                    <span className="px-3 py-1 bg-red-500/20 text-red-400 text-sm rounded-full pulse">
                                        {activeIncidents} Active Incident{activeIncidents > 1 ? 's' : ''}
                                    </span>
                                ) : (
                                    <span className="px-3 py-1 bg-green-500/20 text-green-400 text-sm rounded-full">
                                        All Systems Operational
                                    </span>
                                )}
                                <span className="px-3 py-1 bg-purple-500/20 text-purple-400 text-sm rounded-full">
                                    AutoGen
                                </span>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }
        
        function AgentHierarchy() {
            const agents = [
                { name: 'Incident Commander', role: 'Coordinates', emoji: '👔', color: 'red' },
                { name: 'Monitor Agent', role: 'Observability', emoji: '📊', color: 'cyan' },
                { name: 'Diagnose Agent', role: 'Root Cause', emoji: '🔍', color: 'yellow' },
                { name: 'Infra Fixer', role: 'K8s Ops', emoji: '🔧', color: 'purple' },
                { name: 'App Fixer', role: 'Rollbacks', emoji: '⚙️', color: 'blue' },
                { name: 'Comms Agent', role: 'Notifications', emoji: '📢', color: 'green' },
            ];
            
            return (
                <div className="glass rounded-xl p-4">
                    <h3 className="text-sm font-semibold text-gray-400 mb-3">Agent Hierarchy</h3>
                    <div className="space-y-2">
                        {agents.map((agent, i) => (
                            <div key={agent.name} className={`flex items-center space-x-2 text-sm ${i === 0 ? 'ml-0' : 'ml-4'}`}>
                                <span className="text-lg">{agent.emoji}</span>
                                <span className={`text-${agent.color}-400`}>{agent.name}</span>
                                <span className="text-gray-600 text-xs">• {agent.role}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function ServiceCard({ service }) {
            const healthColor = service.healthy ? 'green' : 'red';
            
            return (
                <div className="glass rounded-lg p-4">
                    <div className="flex items-center justify-between mb-2">
                        <span className="font-semibold text-white">{service.name}</span>
                        <span className={`w-2 h-2 rounded-full bg-${healthColor}-400`}></span>
                    </div>
                    <div className="text-xs text-gray-400 space-y-1">
                        <div>Type: {service.type}</div>
                        <div>Replicas: {service.replicas}</div>
                        <div>CPU: {service.cpu} | Memory: {service.memory}</div>
                    </div>
                </div>
            );
        }
        
        function SimulatePanel({ services, onSimulate }) {
            const [service, setService] = useState('api-gateway');
            const [incidentType, setIncidentType] = useState('high_error_rate');
            
            const incidentTypes = [
                { value: 'high_error_rate', label: '🔴 High Error Rate' },
                { value: 'high_latency', label: '🟠 High Latency' },
                { value: 'service_down', label: '⛔ Service Down' },
                { value: 'high_cpu', label: '🔥 High CPU' },
                { value: 'database_connections', label: '💾 DB Connections' },
            ];
            
            return (
                <div className="glass rounded-xl p-6">
                    <h3 className="text-lg font-semibold text-white mb-4">🧪 Simulate Incident</h3>
                    
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">Service</label>
                            <select
                                value={service}
                                onChange={(e) => setService(e.target.value)}
                                className="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-white"
                            >
                                {services.map(s => (
                                    <option key={s.name} value={s.name}>{s.name}</option>
                                ))}
                            </select>
                        </div>
                        
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">Incident Type</label>
                            <select
                                value={incidentType}
                                onChange={(e) => setIncidentType(e.target.value)}
                                className="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-white"
                            >
                                {incidentTypes.map(t => (
                                    <option key={t.value} value={t.value}>{t.label}</option>
                                ))}
                            </select>
                        </div>
                        
                        <button
                            onClick={() => onSimulate(service, incidentType)}
                            className="w-full bg-red-500 text-white py-3 rounded-lg font-semibold hover:bg-red-600 transition-colors"
                        >
                            🚨 Trigger Incident
                        </button>
                    </div>
                </div>
            );
        }
        
        function IncidentCard({ incident }) {
            const sevClass = `sev${incident.severity?.replace('SEV', '') || '3'}`;
            
            return (
                <div className={`glass rounded-lg p-4 ${sevClass}`}>
                    <div className="flex items-center justify-between mb-2">
                        <span className="font-mono text-sm text-gray-400">{incident.incident_id}</span>
                        <span className={`text-xs px-2 py-1 rounded ${
                            incident.status === 'resolved' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'
                        }`}>
                            {incident.status}
                        </span>
                    </div>
                    
                    <h4 className="font-semibold text-white mb-2">{incident.title}</h4>
                    
                    <div className="text-xs text-gray-400 space-y-1">
                        <div><span className="text-red-400">{incident.severity}</span> • {incident.affected_services?.join(', ')}</div>
                        <div>Root Cause: {incident.root_cause || 'Investigating...'}</div>
                        <div>Actions: {incident.actions_taken?.length || 0} | Duration: {incident.duration_minutes || '?'} min</div>
                    </div>
                </div>
            );
        }
        
        function Timeline({ events }) {
            if (!events || events.length === 0) return null;
            
            return (
                <div className="glass rounded-xl p-4">
                    <h3 className="text-sm font-semibold text-gray-400 mb-3">📋 Timeline</h3>
                    <div className="space-y-2 max-h-64 overflow-y-auto">
                        {events.map((event, i) => (
                            <div key={i} className="flex space-x-3 text-sm">
                                <span className="text-gray-600 mono text-xs">
                                    {new Date(event.timestamp).toLocaleTimeString()}
                                </span>
                                <span className="text-gray-400">{event.description}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        function ResponseProgress({ incident }) {
            const phases = [
                { name: 'Detect', complete: true },
                { name: 'Triage', complete: ['triaged', 'investigating', 'identified', 'mitigating', 'monitoring', 'resolved'].includes(incident?.status) },
                { name: 'Diagnose', complete: ['identified', 'mitigating', 'monitoring', 'resolved'].includes(incident?.status) },
                { name: 'Mitigate', complete: ['mitigating', 'monitoring', 'resolved'].includes(incident?.status) },
                { name: 'Verify', complete: ['monitoring', 'resolved'].includes(incident?.status) },
                { name: 'Resolve', complete: incident?.status === 'resolved' },
            ];
            
            return (
                <div className="flex justify-between">
                    {phases.map((phase, i) => (
                        <div key={phase.name} className="flex flex-col items-center">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${
                                phase.complete ? 'bg-green-500 text-white' : 'bg-gray-700 text-gray-400'
                            }`}>
                                {phase.complete ? '✓' : i + 1}
                            </div>
                            <span className="text-xs text-gray-400 mt-1">{phase.name}</span>
                        </div>
                    ))}
                </div>
            );
        }
        
        function App() {
            const [services, setServices] = useState([]);
            const [incidents, setIncidents] = useState([]);
            const [currentIncident, setCurrentIncident] = useState(null);
            const [loading, setLoading] = useState(false);
            
            useEffect(() => {
                loadServices();
                loadIncidents();
            }, []);
            
            const loadServices = async () => {
                try {
                    const data = await api.getServices();
                    setServices(data.services || []);
                } catch (err) {
                    console.error(err);
                }
            };
            
            const loadIncidents = async () => {
                try {
                    const data = await api.getIncidents();
                    setIncidents(data.incidents || []);
                } catch (err) {
                    console.error(err);
                }
            };
            
            const handleSimulate = async (service, incidentType) => {
                setLoading(true);
                setCurrentIncident(null);
                
                try {
                    const { job_id } = await api.simulate(service, incidentType);
                    
                    // Poll for completion
                    const pollInterval = setInterval(async () => {
                        const status = await api.getIncidentStatus(job_id);
                        
                        if (status.status === 'complete') {
                            clearInterval(pollInterval);
                            setCurrentIncident(status.incident);
                            setLoading(false);
                            loadIncidents();
                        } else if (status.status === 'error') {
                            clearInterval(pollInterval);
                            setLoading(false);
                            alert('Error: ' + status.error);
                        }
                    }, 1000);
                } catch (err) {
                    setLoading(false);
                    console.error(err);
                }
            };
            
            const activeCount = incidents.filter(i => i.status !== 'resolved').length;
            
            return (
                <div className="min-h-screen text-white">
                    <Header activeIncidents={activeCount} />
                    
                    <main className="container mx-auto px-4 py-6">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            {/* Sidebar */}
                            <div className="space-y-4">
                                <AgentHierarchy />
                                <SimulatePanel services={services} onSimulate={handleSimulate} />
                            </div>
                            
                            {/* Main Content */}
                            <div className="lg:col-span-3 space-y-6">
                                {/* Services Grid */}
                                <div>
                                    <h2 className="text-lg font-semibold text-white mb-4">📊 Services</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        {services.map(service => (
                                            <ServiceCard key={service.name} service={service} />
                                        ))}
                                    </div>
                                </div>
                                
                                {/* Loading State */}
                                {loading && (
                                    <div className="glass rounded-xl p-8 text-center">
                                        <div className="text-4xl mb-4 pulse">🚨</div>
                                        <div className="text-xl font-semibold text-white mb-2">
                                            Incident Response in Progress...
                                        </div>
                                        <div className="text-gray-400">
                                            Agents are detecting, diagnosing, and mitigating the issue
                                        </div>
                                    </div>
                                )}
                                
                                {/* Current Incident */}
                                {currentIncident && (
                                    <div className="glass rounded-xl p-6">
                                        <h2 className="text-lg font-semibold text-white mb-4">
                                            🎯 Current Incident Response
                                        </h2>
                                        
                                        <div className="mb-6">
                                            <ResponseProgress incident={currentIncident} />
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <IncidentCard incident={currentIncident} />
                                            <Timeline events={currentIncident.timeline} />
                                        </div>
                                    </div>
                                )}
                                
                                {/* Recent Incidents */}
                                {incidents.length > 0 && (
                                    <div>
                                        <h2 className="text-lg font-semibold text-white mb-4">📜 Recent Incidents</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {incidents.slice(-6).reverse().map((incident, i) => (
                                                <IncidentCard key={i} incident={incident} />
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    
                    <footer className="border-t border-white/10 py-4 mt-8">
                        <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                            🚨 Incident Response System • AutoGen Hierarchical • Autonomous DevOps
                        </div>
                    </footer>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
