<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Content Production Pipeline</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .pipeline-node {
            transition: all 0.3s ease;
        }
        
        .pipeline-node:hover {
            transform: scale(1.05);
        }
        
        .pipeline-node.active {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
        
        .content-type-blog { border-color: #3b82f6; }
        .content-type-social { border-color: #10b981; }
        .content-type-video { border-color: #f59e0b; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .processing {
            animation: pulse 1.5s infinite;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = '';
        
        // API functions
        const api = {
            async createContent(data) {
                const res = await fetch(`${API_BASE}/api/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                return res.json();
            },
            
            async getJobStatus(jobId) {
                const res = await fetch(`${API_BASE}/api/job/${jobId}`);
                return res.json();
            },
            
            async createBlog(topic, length = 'medium') {
                const res = await fetch(`${API_BASE}/api/blog`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, length }),
                });
                return res.json();
            },
            
            async createSocial(topic, platforms) {
                const res = await fetch(`${API_BASE}/api/social`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, platforms }),
                });
                return res.json();
            },
            
            async createVideo(topic) {
                const res = await fetch(`${API_BASE}/api/video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic }),
                });
                return res.json();
            },
        };
        
        // Components
        function Header() {
            return (
                <header className="border-b border-white/10 py-4">
                    <div className="container mx-auto px-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="text-3xl">🎬</div>
                                <div>
                                    <h1 className="text-2xl font-bold text-white">Content Pipeline</h1>
                                    <p className="text-sm text-gray-400">Multi-Platform Content from One Topic</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <span className="text-sm text-gray-400">DAG Architecture</span>
                                <span className="px-2 py-1 bg-purple-500/20 text-purple-400 text-xs rounded">LangGraph</span>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }
        
        function PipelineVisualization({ activeNode }) {
            const nodes = [
                { id: 'brief', label: '📋 Brief', x: 200, y: 30 },
                { id: 'research', label: '🔍 Research', x: 200, y: 90 },
                { id: 'outline', label: '📝 Outline', x: 200, y: 150 },
                { id: 'blog', label: '📄 Blog', x: 80, y: 220 },
                { id: 'social', label: '📱 Social', x: 200, y: 220 },
                { id: 'video', label: '🎥 Video', x: 320, y: 220 },
                { id: 'seo', label: '🔎 SEO', x: 80, y: 290 },
                { id: 'images', label: '🖼️ Images', x: 200, y: 290 },
                { id: 'voice', label: '🎙️ Voice', x: 320, y: 290 },
                { id: 'editor', label: '✏️ Editor', x: 200, y: 360 },
                { id: 'publish', label: '🚀 Publish', x: 200, y: 420 },
            ];
            
            return (
                <div className="glass rounded-xl p-4">
                    <h3 className="text-sm font-medium text-gray-400 mb-3">Pipeline Flow</h3>
                    <svg width="400" height="460" className="mx-auto">
                        {/* Edges */}
                        <line x1="200" y1="50" x2="200" y2="90" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="200" y1="110" x2="200" y2="150" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="180" y1="170" x2="100" y2="210" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="200" y1="170" x2="200" y2="210" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="220" y1="170" x2="300" y2="210" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="80" y1="240" x2="80" y2="280" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="200" y1="240" x2="200" y2="280" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="320" y1="240" x2="320" y2="280" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="100" y1="310" x2="180" y2="350" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="200" y1="310" x2="200" y2="350" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="300" y1="310" x2="220" y2="350" stroke="#6b7280" strokeWidth="2"/>
                        <line x1="200" y1="380" x2="200" y2="410" stroke="#6b7280" strokeWidth="2"/>
                        
                        {/* Nodes */}
                        {nodes.map(node => (
                            <g key={node.id} transform={`translate(${node.x}, ${node.y})`}>
                                <rect 
                                    x="-35" y="-12" 
                                    width="70" height="24" 
                                    rx="4"
                                    fill={activeNode === node.id ? 'rgba(139, 92, 246, 0.5)' : 'rgba(255,255,255,0.1)'}
                                    stroke={activeNode === node.id ? '#8b5cf6' : 'rgba(255,255,255,0.2)'}
                                    strokeWidth="1"
                                />
                                <text 
                                    textAnchor="middle" 
                                    dy="4" 
                                    fill="white" 
                                    fontSize="10"
                                >
                                    {node.label}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        }
        
        function ContentForm({ onSubmit, loading }) {
            const [topic, setTopic] = useState('');
            const [contentTypes, setContentTypes] = useState(['blog', 'social']);
            const [platforms, setPlatforms] = useState(['twitter', 'linkedin']);
            const [tone, setTone] = useState('professional');
            const [length, setLength] = useState('medium');
            
            const toggleContentType = (type) => {
                setContentTypes(prev => 
                    prev.includes(type) 
                        ? prev.filter(t => t !== type)
                        : [...prev, type]
                );
            };
            
            const togglePlatform = (platform) => {
                setPlatforms(prev =>
                    prev.includes(platform)
                        ? prev.filter(p => p !== platform)
                        : [...prev, platform]
                );
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!topic.trim()) return;
                
                onSubmit({
                    topic,
                    content_types: contentTypes,
                    platforms,
                    tone,
                    blog_length: length,
                });
            };
            
            return (
                <form onSubmit={handleSubmit} className="glass rounded-xl p-6 space-y-4">
                    <div>
                        <label className="block text-sm text-gray-400 mb-2">Topic</label>
                        <input
                            type="text"
                            value={topic}
                            onChange={(e) => setTopic(e.target.value)}
                            placeholder="Enter your content topic..."
                            className="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-500"
                        />
                    </div>
                    
                    <div>
                        <label className="block text-sm text-gray-400 mb-2">Content Types</label>
                        <div className="flex flex-wrap gap-2">
                            {['blog', 'social', 'video'].map(type => (
                                <button
                                    key={type}
                                    type="button"
                                    onClick={() => toggleContentType(type)}
                                    className={`px-4 py-2 rounded-lg text-sm transition-all ${
                                        contentTypes.includes(type)
                                            ? 'bg-purple-500/30 border-purple-500 text-purple-300'
                                            : 'bg-white/10 border-white/20 text-gray-400'
                                    } border`}
                                >
                                    {type === 'blog' && '📄 Blog'}
                                    {type === 'social' && '📱 Social'}
                                    {type === 'video' && '🎥 Video'}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {contentTypes.includes('social') && (
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">Platforms</label>
                            <div className="flex flex-wrap gap-2">
                                {['twitter', 'linkedin', 'instagram', 'tiktok'].map(platform => (
                                    <button
                                        key={platform}
                                        type="button"
                                        onClick={() => togglePlatform(platform)}
                                        className={`px-3 py-1.5 rounded-lg text-xs transition-all ${
                                            platforms.includes(platform)
                                                ? 'bg-green-500/30 border-green-500 text-green-300'
                                                : 'bg-white/10 border-white/20 text-gray-400'
                                        } border`}
                                    >
                                        {platform.charAt(0).toUpperCase() + platform.slice(1)}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">Tone</label>
                            <select
                                value={tone}
                                onChange={(e) => setTone(e.target.value)}
                                className="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white"
                            >
                                <option value="professional">Professional</option>
                                <option value="casual">Casual</option>
                                <option value="humorous">Humorous</option>
                                <option value="educational">Educational</option>
                            </select>
                        </div>
                        
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">Blog Length</label>
                            <select
                                value={length}
                                onChange={(e) => setLength(e.target.value)}
                                className="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white"
                            >
                                <option value="short">Short (~500 words)</option>
                                <option value="medium">Medium (~1500 words)</option>
                                <option value="long">Long (~3000 words)</option>
                            </select>
                        </div>
                    </div>
                    
                    <button
                        type="submit"
                        disabled={loading || !topic.trim()}
                        className="w-full bg-purple-500 text-white py-3 rounded-lg hover:bg-purple-600 disabled:opacity-50 flex items-center justify-center space-x-2"
                    >
                        {loading ? (
                            <>
                                <span className="processing">⚙️</span>
                                <span>Generating Content...</span>
                            </>
                        ) : (
                            <>
                                <span>🚀</span>
                                <span>Generate Content</span>
                            </>
                        )}
                    </button>
                </form>
            );
        }
        
        function ContentResult({ result }) {
            const [activeTab, setActiveTab] = useState('blog');
            
            if (!result) return null;
            
            const tabs = [
                { id: 'blog', label: '📄 Blog', available: !!result.blog?.content },
                { id: 'social', label: '📱 Social', available: result.social_posts?.length > 0 },
                { id: 'video', label: '🎥 Video', available: !!result.video?.hook },
                { id: 'seo', label: '🔎 SEO', available: !!result.seo?.overall_score },
            ];
            
            return (
                <div className="glass rounded-xl p-6">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="text-lg font-semibold text-white">Generated Content</h3>
                        <div className="text-sm text-gray-400">
                            {result.summary?.blog_word_count || 0} words | {result.summary?.social_post_count || 0} posts
                        </div>
                    </div>
                    
                    {/* Tabs */}
                    <div className="flex space-x-2 mb-4">
                        {tabs.filter(t => t.available).map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-lg text-sm transition-all ${
                                    activeTab === tab.id
                                        ? 'bg-purple-500/30 text-purple-300'
                                        : 'bg-white/10 text-gray-400 hover:bg-white/20'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>
                    
                    {/* Content */}
                    <div className="bg-black/20 rounded-lg p-4 max-h-96 overflow-y-auto">
                        {activeTab === 'blog' && result.blog && (
                            <div>
                                <h4 className="text-xl font-bold text-white mb-4">{result.blog.title}</h4>
                                <div className="text-gray-300 whitespace-pre-wrap text-sm">
                                    {result.blog.content?.substring(0, 2000)}
                                    {result.blog.content?.length > 2000 && '...'}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'social' && result.social_posts && (
                            <div className="space-y-4">
                                {result.social_posts.map((post, i) => (
                                    <div key={i} className="bg-white/5 rounded-lg p-4">
                                        <div className="text-xs text-purple-400 mb-2">
                                            {post.platform?.toUpperCase()} • {post.character_count} chars
                                        </div>
                                        <div className="text-gray-300 text-sm">{post.text}</div>
                                        <div className="text-xs text-gray-500 mt-2">
                                            {post.hashtags?.map(h => `#${h}`).join(' ')}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {activeTab === 'video' && result.video && (
                            <div>
                                <h4 className="text-lg font-bold text-white mb-2">{result.video.title}</h4>
                                <div className="text-xs text-gray-400 mb-4">
                                    Duration: ~{result.video.estimated_duration}s | Music: {result.video.music_mood}
                                </div>
                                <div className="mb-4">
                                    <div className="text-xs text-yellow-400 mb-1">HOOK</div>
                                    <div className="text-gray-300 text-sm">{result.video.hook}</div>
                                </div>
                                {result.video.script_sections?.map((section, i) => (
                                    <div key={i} className="mb-3">
                                        <div className="text-xs text-cyan-400">{section.timestamp}</div>
                                        <div className="text-gray-300 text-sm">{section.narration}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {activeTab === 'seo' && result.seo && (
                            <div>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="bg-white/5 rounded-lg p-3">
                                        <div className="text-xs text-gray-400">Overall Score</div>
                                        <div className="text-2xl font-bold text-green-400">{result.seo.overall_score}/100</div>
                                    </div>
                                    <div className="bg-white/5 rounded-lg p-3">
                                        <div className="text-xs text-gray-400">Keyword Density</div>
                                        <div className="text-2xl font-bold text-blue-400">{result.seo.keyword_density}%</div>
                                    </div>
                                </div>
                                <div className="text-sm text-gray-400">
                                    <div className="mb-2">Improvements:</div>
                                    <ul className="list-disc list-inside text-gray-300">
                                        {result.seo.improvements?.slice(0, 5).map((imp, i) => (
                                            <li key={i}>{imp}</li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        function App() {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [activeNode, setActiveNode] = useState(null);
            
            const handleSubmit = async (data) => {
                setLoading(true);
                setResult(null);
                
                // Simulate pipeline progress
                const nodes = ['brief', 'research', 'outline', 'blog', 'social', 'video', 'seo', 'images', 'voice', 'editor', 'publish'];
                let nodeIndex = 0;
                
                const progressInterval = setInterval(() => {
                    if (nodeIndex < nodes.length) {
                        setActiveNode(nodes[nodeIndex]);
                        nodeIndex++;
                    }
                }, 500);
                
                try {
                    const { job_id } = await api.createContent(data);
                    
                    // Poll for completion
                    let attempts = 0;
                    const pollInterval = setInterval(async () => {
                        attempts++;
                        const status = await api.getJobStatus(job_id);
                        
                        if (status.status === 'complete') {
                            clearInterval(pollInterval);
                            clearInterval(progressInterval);
                            setResult(status.result);
                            setLoading(false);
                            setActiveNode(null);
                        } else if (status.status === 'error' || attempts > 60) {
                            clearInterval(pollInterval);
                            clearInterval(progressInterval);
                            setLoading(false);
                            setActiveNode(null);
                            alert('Error generating content');
                        }
                    }, 1000);
                } catch (err) {
                    clearInterval(progressInterval);
                    setLoading(false);
                    setActiveNode(null);
                    console.error(err);
                }
            };
            
            return (
                <div className="min-h-screen">
                    <Header />
                    
                    <main className="container mx-auto px-4 py-6">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Sidebar */}
                            <div>
                                <PipelineVisualization activeNode={activeNode} />
                            </div>
                            
                            {/* Main Content */}
                            <div className="lg:col-span-2 space-y-6">
                                <ContentForm onSubmit={handleSubmit} loading={loading} />
                                <ContentResult result={result} />
                            </div>
                        </div>
                    </main>
                    
                    <footer className="border-t border-white/10 py-4 mt-8">
                        <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                            🎬 Content Production Pipeline • LangGraph DAG • Multi-Platform Content
                        </div>
                    </footer>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
